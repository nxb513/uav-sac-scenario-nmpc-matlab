name: D1 real-wind evaluation (teacher-free)

# Flies LQR / LQI / proposed-blend variants against REAL wind (Neural-Fly measured force,
# SWUF-3D field sonic wind) on nominal / train / OOD true plants. All controllers are
# designed on the nominal model. No acados needed (no NMPC teacher).
# Wind data are downloaded from their original sources inside each job and are NOT
# uploaded as artifacts (Neural-Fly: personal/educational use only).

on:
  workflow_dispatch:
    inputs:
      controllers:
        description: "Comma list: LQR,LQI,Ptight,P104,PtightI,P104I,PtightJ,P104J"
        required: true
        default: "LQI,PtightJ,P104J"
        type: string
      plantsets:
        description: "JSON array of true-plant sets (nom | train | ood)"
        required: true
        default: '["nom","train","ood"]'
        type: string
      shards:
        description: "JSON array of shard indices (1..nshards)"
        required: true
        default: "[1,2,3,4]"
        type: string
      nshards:
        description: "Total number of shards per plant set"
        required: true
        default: "4"
        type: string
      tight_run_id:
        description: "Run id holding d1-joint-ckpt-seed260914201-<id> (Bryson tight chain)"
        required: true
        default: "36248622273"
        type: string
      r104_run_id:
        description: "Run id holding d1-joint-ckpt-seed260914104-<id> (random-QR seed 104 chain)"
        required: true
        default: "36248632694"
        type: string

jobs:
  eval:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        plantset: ${{ fromJSON(inputs.plantsets) }}
        shard: ${{ fromJSON(inputs.shards) }}
    env:
      D1_SEED: "260914201"
      D1_PLANTSET: ${{ matrix.plantset }}
      D1_SHARD: ${{ matrix.shard }}/${{ inputs.nshards }}
      D1_CTRLS: ${{ inputs.controllers }}
      D1_WIND_DIR: ${{ github.workspace }}/wind/series
      D1_OUT: ${{ github.workspace }}/results/wind_eval
      D1_CKPT_T: ${{ github.workspace }}/ckpt/tight/checkpoint_seed260914201.mat
      D1_CONF_T: ${{ github.workspace }}/ckpt/tight/conf_seed260914201.mat
      D1_CKPT_R: ${{ github.workspace }}/ckpt/r104/checkpoint_seed260914104.mat
      D1_CONF_R: ${{ github.workspace }}/ckpt/r104/conf_seed260914104.mat
    steps:
      - name: Check out research package
        uses: actions/checkout@v6

      - name: Download tight-chain surrogate checkpoint
        uses: actions/download-artifact@v4
        with:
          name: d1-joint-ckpt-seed260914201-${{ inputs.tight_run_id }}
          path: ckpt/tight
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.tight_run_id }}

      - name: Download seed-104 surrogate checkpoint
        uses: actions/download-artifact@v4
        with:
          name: d1-joint-ckpt-seed260914104-${{ inputs.r104_run_id }}
          path: ckpt/r104
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.r104_run_id }}

      - name: Fetch real-wind data and build force series (not redistributed)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pandas numpy h5py
          mkdir -p wind/nf wind/swuf
          base=https://raw.githubusercontent.com/aerorobotics/neural-fly/main/data
          for f in experiment/custom_figure8_baseline_nowind experiment/custom_figure8_baseline_35wind \
                   experiment/custom_figure8_baseline_70wind experiment/custom_figure8_baseline_70p20sint \
                   experiment/custom_figure8_baseline_100wind training/custom_random3_baseline_nowind \
                   training/custom_random3_baseline_10wind training/custom_random3_baseline_20wind \
                   training/custom_random3_baseline_30wind training/custom_random3_baseline_40wind \
                   training/custom_random3_baseline_50wind; do
            curl -sSfL --retry 3 -o "wind/nf/$(basename "$f").csv" "$base/$f.csv"
          done
          curl -sSfL --retry 3 -o wind/swuf/2025.zip \
            "https://zenodo.org/api/records/17700905/files/2025_field_measurements.zip/content"
          unzip -q -o wind/swuf/2025.zip -d wind/swuf
          python3 tools/wind/prepare_wind_series.py --nf wind/nf --swuf wind/swuf --out wind/series

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024a
          products: >-
            Deep_Learning_Toolbox
            Control_System_Toolbox
            Statistics_and_Machine_Learning_Toolbox
          cache: true

      - name: Run wind evaluation (${{ matrix.plantset }} shard ${{ matrix.shard }})
        timeout-minutes: 170
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            addpath(genpath('src')); addpath('configs'); addpath('experiments');
            d1_wind_eval;

      - name: Upload results (controller metrics only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-wind-eval-${{ matrix.plantset }}-${{ matrix.shard }}-${{ github.run_id }}
          path: results/wind_eval/
          if-no-files-found: warn
          retention-days: 30

  summary:
    needs: eval
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Check out research package
        uses: actions/checkout@v6

      - name: Download all result files
        uses: actions/download-artifact@v4
        with:
          pattern: d1-wind-eval-*-${{ github.run_id }}
          path: results
          merge-multiple: true

      - name: Summarize
        run: |
          python3 -m pip install --quiet pandas
          python3 tools/wind/summarize_wind_eval.py results | tee summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: d1-wind-eval-summary-${{ github.run_id }}
          path: summary.md
          retention-days: 30
