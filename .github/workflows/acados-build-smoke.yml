name: acados build smoke

# INFRASTRUCTURE smoke test (NOT a science run): proves the acados + CasADi +
# MATLAB toolchain builds and solves a trivial OCP on the ubuntu-22.04 runner.
# This de-risks the acados path before writing the CasADi scenario-NMPC teacher.

on:
  workflow_dispatch:

jobs:
  acados-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out research package
        uses: actions/checkout@v6

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential git unzip wget

      - name: Clone and build acados
        run: |
          set -euxo pipefail
          git clone https://github.com/acados/acados.git "$GITHUB_WORKSPACE/acados"
          cd "$GITHUB_WORKSPACE/acados"
          git submodule update --recursive --init
          mkdir -p build && cd build
          cmake -DACADOS_WITH_QPOASES=ON \
                -DACADOS_INSTALL_DIR="$GITHUB_WORKSPACE/acados" \
                ..
          make install -j4
          ls -la "$GITHUB_WORKSPACE/acados/lib" | head
          echo "ACADOS_INSTALL_DIR=$GITHUB_WORKSPACE/acados" >> "$GITHUB_ENV"
          echo "ACADOS_SOURCE_DIR=$GITHUB_WORKSPACE/acados" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/acados/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Download CasADi (MATLAB, linux64)
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/acados/external/casadi-matlab"
          cd "$GITHUB_WORKSPACE/acados/external/casadi-matlab"
          wget -q https://github.com/casadi/casadi/releases/download/3.6.7/casadi-3.6.7-linux64-matlab2018b.zip -O casadi.zip
          unzip -q casadi.zip
          rm -f casadi.zip
          ls | head
          echo "CASADI_DIR=$GITHUB_WORKSPACE/acados/external/casadi-matlab" >> "$GITHUB_ENV"

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024a
          products: Optimization_Toolbox Control_System_Toolbox
          cache: true

      - name: Run acados MATLAB smoke (build mex + solve trivial OCP)
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            setenv('ENV_RUN','true');
            setenv('ACADOS_INSTALL_DIR',getenv('ACADOS_INSTALL_DIR'));
            addpath(getenv('CASADI_DIR'));
            addpath(fullfile(getenv('ACADOS_INSTALL_DIR'),'interfaces','acados_matlab_octave'));
            cd(fullfile(getenv('ACADOS_INSTALL_DIR'),'examples','acados_matlab_octave','getting_started'));
            t=tic; minimal_example_ocp; dt=toc(t);
            fprintf('ACADOS_SMOKE_PASSED single_ocp_pipeline_seconds=%.3f\n', dt);
