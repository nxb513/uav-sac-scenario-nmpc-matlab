name: MATLAB SAC-NMPC 100-transition pilot

on:
  workflow_dispatch:
    inputs:
      solver_wall_seconds:
        description: Candidate per-solve safety limit for this pilot only
        required: true
        default: "60"
        type: choice
        options:
          - "30"
          - "60"
          - "120"

permissions:
  contents: read

jobs:
  continuous-sync3-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      NMPC_MAX_WALL_SECONDS: ${{ inputs.solver_wall_seconds }}
    steps:
      - name: Check out public research package
        uses: actions/checkout@v6

      - name: Set up MATLAB and required products
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024a
          products: Reinforcement_Learning_Toolbox Deep_Learning_Toolbox Optimization_Toolbox Parallel_Computing_Toolbox Control_System_Toolbox
          cache: true

      - name: Run continuous SAC sync-3 pilot
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('experiments'); run_targeted_sac_100_transition_probe

      - name: Upload logs, runtime, and checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sac-nmpc-sync3-pilot-${{ github.run_id }}
          path: results/targeted_lqr_weak_rebuild_v1/specialist_sac_v1/actual_sac_sync3_100_v1
          if-no-files-found: warn
          retention-days: 7

