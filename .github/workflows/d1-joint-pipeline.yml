name: D1 joint pipeline

# ONE task per seed. SAC phase: SAC tunes the NMPC Q,R of the acados teacher (privileged
# wind) on paired teacher/LQR rollouts -> checkpoint. DAgger phase (dagger=1): frozen
# teacher -> linear student by DAgger -> c_S / c_LQR -> student file. Open-ended (runs
# until wall_seconds or stop_iter, checkpoint after every iteration, resume to continue).
# The flights of one iteration run in parallel on `workers` local MATLAB workers.
# Code: experiments/run_d1_joint_pipeline.m + src/joint/d1_*.m;
# method: docs/D1_method.pdf.

on:
  workflow_dispatch:
    inputs:
      wall_seconds:
        description: SAC wall-time budget per job (resume to continue)
        required: true
        default: "300"
        type: string
      steps:
        description: Rollout steps per case (frozen 1000; small = quick self-check)
        required: true
        default: "1000"
        type: string
      cases_per_eval:
        description: Cases per SAC evaluation (frozen 20; small = quick self-check)
        required: true
        default: "20"
        type: string
      diag:
        description: "1 = diagnostic flight (dump trajectories, no SAC); 0 = train"
        required: false
        default: "0"
        type: string
      surr_eval:
        description: "1 = evaluate the student (alpha=1) and the blend, teacher-free (needs a run with the student file)"
        required: false
        default: "0"
        type: string
      compare:
        description: "1 = compare LQR / teacher / student alpha=1 / blend (needs a run with the student file)"
        required: false
        default: "0"
        type: string
      hard:
        description: "1 = compare on hardest case (max v,a) per family; 0 = mid case"
        required: false
        default: "0"
        type: string
      consolidate:
        description: "1 = recompute c_S and c_LQR of an existing student file (teacher-free)"
        required: false
        default: "0"
        type: string
      seeds:
        description: JSON array of seeds to run (1 or more)
        required: false
        default: "[261003001]"
        type: string
      solver:
        description: "NMPC solver: SQP (used by every run) or SQP_RTI"
        required: false
        default: "SQP"
        type: string
      resume_run_id:
        description: Prior run id to resume checkpoints from (empty = fresh)
        required: false
        default: ""
        type: string
      alpha_safe:
        description: "1 = blend uses Lyapunov safeguard alpha_safe=min(cS*gL,(1-eps)*alpha_bar)"
        required: false
        default: "0"
        type: string
      plant_perturb:
        description: "compare off-nominal: flight plant perturb scale x train rho (0=nominal)"
        required: false
        default: "0"
        type: string
      c_low:
        description: "g_L gate low threshold on c_LQR (blend hyperparameter)"
        required: false
        default: "0.3"
        type: string
      c_high:
        description: "g_L gate high threshold on c_LQR (blend hyperparameter)"
        required: false
        default: "0.7"
        type: string
      random_qr:
        description: "1 = teacher Q,R base is RANDOM per seed (no Bryson warm-start); 0 = Bryson"
        required: false
        default: "0"
        type: string
      stop_iter:
        description: "Stop exactly at this SAC iteration (0 = off)"
        required: false
        default: "0"
        type: string
      wind:
        description: "1 = random training wind (1-10 m/s mean + Dryden gusts, rotor-drag force); 0 = no wind"
        required: false
        default: "1"
        type: string
      ckpt_every:
        description: "Save a frozen milestone SAC checkpoint every N SAC iterations (1 = every iteration; 0 = off)"
        required: false
        default: "1"
        type: string
      workers:
        description: "Local parallel workers for the flights of one SAC / DAgger iteration (0 = serial)"
        required: false
        default: "4"
        type: string
      dagger:
        description: "1 = DAgger phase: learn the linear student from the frozen teacher of the checkpoint in resume_run_id"
        required: false
        default: "0"
        type: string
      ckpt_suffix:
        description: "Which SAC checkpoint DAgger/modes use: empty = checkpoint_seed<s>.mat, _iter0100 = milestone"
        required: false
        default: ""
        type: string

jobs:
  joint:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        seed: ${{ fromJSON(inputs.seeds) }}
    env:
      D1_SEED: ${{ matrix.seed }}
      D1_WALL_SECONDS: ${{ inputs.wall_seconds }}
      D1_STEPS: ${{ inputs.steps }}
      D1_CASES_PER_EVAL: ${{ inputs.cases_per_eval }}
      D1_DIAG: ${{ inputs.diag }}
      D1_SURR_EVAL: ${{ inputs.surr_eval }}
      D1_COMPARE: ${{ inputs.compare }}
      D1_HARD: ${{ inputs.hard }}
      D1_CONSOLIDATE: ${{ inputs.consolidate }}
      D1_ALPHA_SAFE: ${{ inputs.alpha_safe }}
      D1_PLANT_PERTURB: ${{ inputs.plant_perturb }}
      D1_C_LOW: ${{ inputs.c_low }}
      D1_C_HIGH: ${{ inputs.c_high }}
      D1_RANDOM_QR: ${{ inputs.random_qr }}
      D1_STOP_ITER: ${{ inputs.stop_iter }}
      D1_WIND: ${{ inputs.wind }}
      D1_CKPT_EVERY_ITER: ${{ inputs.ckpt_every }}
      D1_WORKERS: ${{ inputs.workers }}
      D1_DAGGER: ${{ inputs.dagger }}
      D1_CKPT_SUFFIX: ${{ inputs.ckpt_suffix }}
      D1_SOLVER: ${{ inputs.solver }}
      D1_RUN_DIR: ${{ github.workspace }}/results/d1_joint/seed${{ matrix.seed }}
      # acados commit used by every D1 job (training and final evaluation)
      ACADOS_COMMIT: 503364817c872d474ab5bed219c26760ac267769   # official release acados v0.6.0
    steps:
      - name: Check out research package
        uses: actions/checkout@v6

      - name: Download prior checkpoint (resume)
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: d1-joint-ckpt-seed${{ matrix.seed }}-${{ inputs.resume_run_id }}
          path: results/d1_joint/seed${{ matrix.seed }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resume_run_id }}

      - name: Set resume flag
        run: |
          if [ -n "${{ inputs.resume_run_id }}" ]; then
            # a resume must continue the chain: never fall back to a fresh start
            test -f "results/d1_joint/seed${{ matrix.seed }}/checkpoint_seed${{ matrix.seed }}.mat" \
              || { echo "resume requested but no checkpoint for seed ${{ matrix.seed }}"; exit 1; }
            echo "D1_RESUME=1" >> "$GITHUB_ENV"
          else
            echo "D1_RESUME=0" >> "$GITHUB_ENV"
          fi

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential git unzip wget gdb

      - name: Clone and build acados (pinned)
        run: |
          set -euxo pipefail
          # every job of every chain uses the SAME acados version
          git clone https://github.com/acados/acados.git "$GITHUB_WORKSPACE/acados"
          cd "$GITHUB_WORKSPACE/acados"
          git checkout "$ACADOS_COMMIT"
          git submodule update --recursive --init
          mkdir -p build && cd build
          cmake -DACADOS_WITH_QPOASES=ON -DACADOS_INSTALL_DIR="$GITHUB_WORKSPACE/acados" ..
          make install -j4
          echo "ACADOS_INSTALL_DIR=$GITHUB_WORKSPACE/acados" >> "$GITHUB_ENV"
          echo "ACADOS_SOURCE_DIR=$GITHUB_WORKSPACE/acados" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/acados/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Download CasADi (MATLAB, linux64)
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/acados/external/casadi-matlab"
          cd "$GITHUB_WORKSPACE/acados/external/casadi-matlab"
          wget -q https://github.com/casadi/casadi/releases/download/3.6.7/casadi-3.6.7-linux64-matlab2018b.zip -O casadi.zip
          unzip -q casadi.zip && rm -f casadi.zip
          echo "CASADI_DIR=$GITHUB_WORKSPACE/acados/external/casadi-matlab" >> "$GITHUB_ENV"

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024a
          products: >-
            Deep_Learning_Toolbox
            Optimization_Toolbox
            Control_System_Toolbox
            Statistics_and_Machine_Learning_Toolbox
            Parallel_Computing_Toolbox
          cache: true

      - name: Start hang watchdog (diagnostics only)
        run: |
          nohup bash tools/ci/hang_watchdog.sh "$D1_RUN_DIR" 3600 > "$RUNNER_TEMP/hang_watchdog.log" 2>&1 &
          echo "watchdog started"

      - name: Run joint pipeline (seed ${{ matrix.seed }})
        timeout-minutes: 340
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            setenv('ENV_RUN','true');
            setenv('ACADOS_INSTALL_DIR',getenv('ACADOS_INSTALL_DIR'));
            addpath(getenv('CASADI_DIR'));
            addpath(fullfile(getenv('ACADOS_INSTALL_DIR'),'interfaces','acados_matlab_octave'));
            addpath(genpath('src')); addpath('configs'); addpath('experiments');
            run_d1_joint_pipeline;

      - name: Show hang watchdog log
        if: always()
        run: cat "$RUNNER_TEMP/hang_watchdog.log" || true

      - name: Upload checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-joint-ckpt-seed${{ matrix.seed }}-${{ github.run_id }}
          path: results/d1_joint/seed${{ matrix.seed }}/
          if-no-files-found: warn
          retention-days: 30
